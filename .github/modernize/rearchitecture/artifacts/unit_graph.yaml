units:
  - name: auth
    trigger: route
    trigger_detail: "POST /api/v1/auth/{register,login,forgot-password,reset-password}"
    source_anchors: [{path: backend/app/routers/auth.py, line: 31}]
    exported_signature: [{method: "HTTP auth request/response contracts", source_loc: "backend/app/routers/auth.py:31", stability: frozen}]
    dynamic_entrypoints: []
    depends_on: []
    shared_refs: [{module: config, used_fields: [app_env, frontend_origin]}]
  - name: users
    trigger: route
    trigger_detail: "GET/PATCH /api/v1/users/me and GET /api/v1/users/me/dashboard"
    source_anchors: [{path: backend/app/routers/users.py, line: 16}]
    exported_signature: [{method: "HTTP user profile/dashboard contracts", source_loc: "backend/app/routers/users.py:16", stability: frozen}]
    dynamic_entrypoints: []
