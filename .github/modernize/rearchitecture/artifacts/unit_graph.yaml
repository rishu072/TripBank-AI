    source_anchors: [{path: frontend/src/App.jsx, line: 20}]
    exported_signature: [{method: "Browser route and API client behavior", source_loc: "frontend/src/App.jsx:20", stability: frozen}]
    dynamic_entrypoints: []
    depends_on: [{unit: auth, via: "HTTP API"}, {unit: trips, via: "HTTP API"}, {unit: payments-webhooks, via: "HTTP API"}, {unit: expenses, via: "HTTP API"}, {unit: ai, via: "HTTP API"}]
